<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SignSync — ASL Fingerspelling Coach</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <header>
      <h1>Sign<span>Sync</span></h1>
      <nav class="header-nav">
        <a href="./capture.html">capture tool</a>
        <p id="fps">— fps</p>
      </nav>
    </header>
    <main>
      <div class="pane">
        <!-- Mirror the whole wrapper, not the video alone: video and overlay
             flip together, so the skeleton can never drift off the hand. -->
        <div id="mirror">
          <video id="video" playsinline muted></video>
          <canvas id="overlay"></canvas>
        </div>
        <p id="status" role="status">Requesting camera…</p>
      </div>
      <aside id="debug" aria-label="Live feature inspector"></aside>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
