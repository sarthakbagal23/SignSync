name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      # Copies MediaPipe WASM from node_modules -> public/ and downloads the
      # hand_landmarker.task model (~7.8 MB) so dist/ is fully self-contained.
      - run: npm run setup
      - run: npm run build

      - uses: actions/configure-pages@v5
        with:
          # Auto-enables Pages on the repo on first run, so no manual
          # Settings → Pages setup step is needed.
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
